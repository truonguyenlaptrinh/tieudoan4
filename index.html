<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiểu đoàn 4 | Cổng thông tin</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0eb;color:#243126;font:16px Arial,sans-serif}header{background:#253e29;color:white;padding:28px 6%;border-bottom:5px solid #d9b65a}header small{letter-spacing:2px;color:#e6d6a1}h1{margin:12px 0;font-size:clamp(23px,4vw,36px)}nav{background:#8c2025;display:flex;flex-wrap:wrap;padding:0 5%}button{cursor:pointer;font:inherit;border:0;padding:12px 16px}nav button{background:none;color:white;font-weight:bold}nav button:hover,nav button.active{background:#64151a}main{max-width:1200px;margin:24px auto;padding:0 18px}.hero{background:linear-gradient(110deg,#263e29,#60744a);color:white;padding:38px;border-radius:5px;border-left:6px solid #d9b65a}.hero h2{font-size:30px;max-width:700px} .tag{font-size:12px;letter-spacing:2px;color:#f2d78a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin:20px 0}.card,section{background:white;padding:22px;border:1px solid #d7ddd3;border-radius:5px}h2,h3{margin-top:0}h3{color:#34533a}.action{background:#34533a;color:white;border-radius:4px}input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #b9c4b7;font:inherit}label{display:block;margin:10px 0}input[type=radio]{width:auto}footer{background:#253e29;color:#fff;padding:25px 6%;font-size:14px}.muted{color:#667363;font-size:14px}.notice{background:#fff5d9;padding:12px;border-left:4px solid #c49b38;margin:15px 0}.row{border-bottom:1px solid #ddd;padding:14px 0}a{color:#34533a} .badge{background:#e8eee4;color:#34533a;padding:5px 8px;font-size:12px}button:focus-visible{outline:3px solid #d9b65a}</style><header><small>TRUNG ĐOÀN 8 · SƯ ĐOÀN 395</small><h1>★ TIỂU ĐOÀN 4</h1><div>CỔNG THÔNG TIN ĐIỆN TỬ — ĐOÀN KẾT · KỶ LUẬT · SÁNG TẠO · QUYẾT THẮNG</div></header><nav id="nav"></nav><main id="main"></main><footer>TIỂU ĐOÀN 4 – TRUNG ĐOÀN 8 – SƯ ĐOÀN 395<br><br>Bản mẫu thử nghiệm độc lập · Không phải cổng thông tin chính thức.</footer><script>
const pages=['Trang chủ','Giới thiệu','Tin tức – Sự kiện','Công tác Đảng, CTCT','Công tác Đoàn','Thư viện','Kiểm tra nhận thức','Quản trị thử nghiệm'];const $=id=>document.getElementById(id);const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}};const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let posts=read('td4posts');const samples=[{title:'Tiếp bước cha anh – Viết tiếp khúc quân hành',body:'Chuyên đề giáo dục truyền thống và trách nhiệm của tuổi trẻ.',cat:'Công tác Đoàn'},{title:'Xây dựng môi trường văn hóa quân sự',body:'Chuyên đề về lời nói chuẩn mực, tinh thần đoàn kết và ý thức kỷ luật.',cat:'Công tác Đảng, CTCT'},{title:'Chuyển đổi số trong học tập',body:'Giới thiệu phương pháp học tập và kiểm tra nhận thức bằng công nghệ số.',cat:'Tin tức – Sự kiện'}];function cards(list){return '<div class="grid">'+list.map(p=>`<article class="card"><span class="badge">${esc(p.cat)}</span><h3 style="margin-top:16px">${esc(p.title)}</h3><p>${esc(p.body)}</p></article>`).join('')+'</div>'}function go(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('active',i===j));let all=[...posts,...samples];let m=$('main');if(i===0)m.innerHTML=`<div class="hero"><div class="tag">TRUYỀN THỐNG – TRÁCH NHIỆM – KHÁT VỌNG</div><h2>Tiếp bước cha anh<br>Viết tiếp khúc quân hành</h2><p>Không gian thông tin, giáo dục truyền thống và học tập số.</p><button class="action" onclick="go(2)">Khám phá tin bài →</button></div><div class="notice">BẢNG TIN: Đây là giao diện minh họa. Nội dung mẫu chưa được phê duyệt công bố.</div><h2>Thông tin nổi bật</h2>${cards(all)}<div class="grid"><div class="card"><h3>Thư viện điện tử</h3><p>Tài liệu phổ biến công khai.</p><button class="action" onclick="go(5)">Truy cập</button></div><div class="card"><h3>Học tập trực tuyến</h3><p>Trắc nghiệm và xem kết quả ngay.</p><button class="action" onclick="go(6)">Bắt đầu</button></div></div>`;else if(i===1)m.innerHTML='<section><h2>Giới thiệu đơn vị</h2><p>Tiểu đoàn 4 – Trung đoàn 8 – Sư đoàn 395.</p><p>Không gian giới thiệu lịch sử, truyền thống và thành tích. Nội dung chính thức sẽ được bổ sung sau khi được cấp có thẩm quyền phê duyệt.</p></section>';else if(i>=2&&i<=4)m.innerHTML=`<h2>${pages[i]}</h2><input id="search" placeholder="Tìm kiếm tin bài..." oninput="filter(${i})"><div id="results"></div>`,filter(i);else if(i===5)m.innerHTML='<section><h2>Thư viện điện tử</h2><p>Danh mục tài liệu công khai tham khảo</p><div class="row"><a href="https://vanban.chinhphu.vn/" target="_blank" rel="noopener">Cổng văn bản Chính phủ ↗</a></div><div class="row"><a href="https://www.qdnd.vn/" target="_blank" rel="noopener">Báo Quân đội nhân dân ↗</a></div><p class="muted">Không tải lên tài liệu mật hoặc dữ liệu nội bộ.</p></section>';else if(i===6)quiz();else admin();window.scrollTo(0,0)}function filter(i){let q=$('search').value.toLowerCase();let a=[...posts,...samples].filter(p=>(i===2||p.cat===pages[i])&&(p.title+' '+p.body).toLowerCase().includes(q));$('results').innerHTML=a.length?cards(a):'<p>Không có tin bài phù hợp.</p>'}const questions=[['Ngày thành lập Quân đội nhân dân Việt Nam?',['22/12/1944','19/12/1946','02/09/1945'],0],['Ngày hội Quốc phòng toàn dân?',['30/4','22/12','2/9'],1],['Khi gặp thông tin chưa kiểm chứng, nên làm gì?',['Chia sẻ ngay','Đăng lại','Kiểm chứng trước khi chia sẻ'],2]];function quiz(){$('main').innerHTML='<section><h2>Kiểm tra nhận thức – Đề mẫu</h2><p>03 câu hỏi kiến thức chung</p><form id="quiz">'+questions.map((q,i)=>`<div class="row"><b>Câu ${i+1}. ${q[0]}</b>${q[1].map((a,j)=>`<label><input required type="radio" name="q${i}" value="${j}"> ${a}</label>`).join('')}</div>`).join('')+'<button class="action">Nộp bài</button></form><div id="score" aria-live="polite"></div><p class="muted">Kết quả chỉ lưu trên trình duyệt này.</p></section>';$('quiz').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n=questions.filter((q,i)=>Number(f.get('q'+i))===q[2]).length;save('td4scores',[...read('td4scores'),{date:new Date().toLocaleString('vi-VN'),score:n}]);$('score').innerHTML=`<div class="notice">Kết quả: ${n}/3 câu đúng.</div>`}}function admin(){$('main').innerHTML=`<section><h2>Quản trị nội dung – bản thử nghiệm</h2><div class="notice">Không có xác thực hoặc phân quyền thật. Chỉ nhập nội dung giả lập, không nhạy cảm.</div><form id="post"><input name="title" required placeholder="Tiêu đề tin bài"><select name="cat">${pages.slice(2,5).map(p=>`<option>${p}</option>`).join('')}</select><textarea name="body" required rows="5" placeholder="Nội dung tin bài"></textarea><button class="action">Lưu tin bài trên máy</button></form><h3 style="margin-top:25px">Tin đã tạo</h3>${posts.map((p,i)=>`<div class="row">${esc(p.title)} <button onclick="removePost(${i})">Xóa</button></div>`).join('')}<h3 style="margin-top:25px">Lịch sử kiểm tra trên máy</h3>${read('td4scores').map(s=>`<div class="row">${esc(s.date)} — ${esc(s.score)}/3</div>`).join('')||'Chưa có kết quả.'}</section>`;$('post').onsubmit=e=>{e.preventDefault();posts.unshift(Object.fromEntries(new FormData(e.target)));save('td4posts',posts);admin()}}function removePost(i){if(confirm('Xóa tin bài này?')){posts.splice(i,1);save('td4posts',posts);admin()}}$('nav').innerHTML=pages.map((p,i)=>`<button onclick="go(${i})">${p}</button>`).join('');go(0);</script></html>
